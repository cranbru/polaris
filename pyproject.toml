[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "polaris-forensics"
version = "1.0.0"
description = "POLARIS — Your guide to Digital Forensics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "reportlab>=4.0.0",
    "python-evtx>=0.7.0",
    "python-registry>=1.3.0",
    "LnkParse3>=1.4.0",
    "olefile>=0.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
polaris = "main:run"

[tool.setuptools.packages.find]
include = ["config*", "core*", "collectors*", "parsers*", "analysis*", "cli*", "reports*", "packaging*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: Windows integration tests requiring admin privileges",
    "unit: Unit tests with mocked data",
]
